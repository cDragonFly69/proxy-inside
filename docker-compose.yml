services:
  proxy:
    build: .
    image: ccs-proxy:latest
    container_name: ccs-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"      # Web 管理面板
      - "18081:18081"    # HTTP 代理
      - "18082:18082"    # SOCKS5 + UDP
      - "2222:2222"      # GitHub SSH 中转
    environment:
      # ── 面板登录（务必改）────────────────────────────
      PANEL_USER: admin
      PANEL_PASS: change-me-please
      # ── 代理 ─────────────────────────────────────────
      # 首次启动会在 /data/users.json 里自动建一个 admin 用户，
      # token 用下面的 TOKEN；留空则随机生成并打印在容器日志里。
      TOKEN: ""
      # 目标白名单，逗号分隔后缀匹配；留空=不限
      ALLOW: "github.com,163.com,githubusercontent.com"
      # 日志里展示的客户端 IP（真实 IP 记到 /data/ccsproxy.real.log）
      MASK_IP: ""
      MAX_CONN: "200"
      TIMEOUT: "30"
      # 客户端不支持 RFC1929 时按无认证放行（UU 远程这类）
      RELAX_AUTH: "1"
      # GitHub SSH 中转的上游
      GH_RELAY_UPSTREAM: "github.com:22"
    volumes:
      - ./data:/data
    # UDP relay 用随机端口；要用 UDP（UU 远程 / TUN 客户端）必须 host 网络
    # network_mode: host
