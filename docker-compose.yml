services:
  ccsproxy:
    build: .
    image: ccsproxy:1.0
    container_name: ccsproxy
    ports:
      - "18081:18081"
    environment:
      PORT: "18081"
      # 白名单按后缀匹配：163.com 覆盖 UU 远程所有 *.163.com 子域
      ALLOW: "github.com,codeload.github.com,objects.githubusercontent.com,release-assets.githubusercontent.com,api.github.com,163.com"
      # 生产务必改掉；也可改用 TOKEN_FILE 挂载 secret
      TOKEN: "change-me-please"
      MAX_CONN: "200"
      TIMEOUT: "30"
      # 容器内出口 IP 由 docker NAT 决定，--srcip 一般留空
      SRCIP: ""
    restart: "no"          # 临时跳板，用完即关：docker compose down
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
